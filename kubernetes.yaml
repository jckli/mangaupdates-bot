apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsuuchi-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tsuuchi 
  template:
    metadata:
      labels:
        app: tsuuchi 
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: tsuuchi 
        image: jckli/tsuuchi:latest 
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /internal/status
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /internal/status
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        env:
        - name: PORT
          value: "8080"
        envFrom:
        - secretRef:
            name: tsuuchi-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: tsuuchi-service 
spec:
  selector:
    app: tsuuchi 
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
